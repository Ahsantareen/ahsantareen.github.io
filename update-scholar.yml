name: Update Google Scholar Data

on:
  schedule:
    # Runs every Monday at 03:00 UTC. Adjust as you like.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests
          pip install scholarly

      - name: Fetch latest Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_scholar.py

      - name: Commit updated scholar_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scholar_data.json
          git diff --quiet --cached || git commit -m "chore: auto-update Google Scholar stats"
          git push
